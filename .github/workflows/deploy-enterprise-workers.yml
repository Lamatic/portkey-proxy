name: Deploy Enterprise Workers

on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker to deploy (or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - production-enterprise-portkey-isolated
          - production-enterprise-portkey-isolated-nologs
  push:
    branches:
      - lamatic-main
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker_name: production-enterprise-portkey-isolated
            config: wrangler.toml
            custom_domain: production-enterprise-portkey-isolated.edge.lamatic.tech
          - worker_name: production-enterprise-portkey-isolated-nologs
            config: wrangler.nologs.toml
            custom_domain: production-enterprise-portkey-isolated-nologs.edge.lamatic.tech

    steps:
      - name: Check if this worker should deploy
        id: should_deploy
        run: |
          INPUT="${{ github.event.inputs.worker }}"
          WORKER="${{ matrix.worker_name }}"
          if [ -z "$INPUT" ] || [ "$INPUT" = "all" ] || [ "$INPUT" = "$WORKER" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.should_deploy.outputs.deploy == 'true'

      - name: Setup Node.js
        if: steps.should_deploy.outputs.deploy == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.should_deploy.outputs.deploy == 'true'
        run: npm i

      - name: Configure custom domain
        if: steps.should_deploy.outputs.deploy == 'true'
        env:
          CONFIG_FILE: ${{ matrix.config }}
          CUSTOM_DOMAIN: ${{ matrix.custom_domain }}
        run: |
          node -e '
            const fs = require("fs");
            const configFile = process.env.CONFIG_FILE;
            const customDomain = process.env.CUSTOM_DOMAIN;
            const config = fs.readFileSync(configFile, "utf8");
            const base = `compatibility_flags = [ "nodejs_compat" ]`;
            if (!config.includes(base)) {
              throw new Error(`Could not find compatibility_flags marker in ${configFile}`);
            }
            const updated = config.replace(
              base,
              `${base}\nroutes = [ { pattern = "${customDomain}", custom_domain = true } ]`
            );
            fs.writeFileSync(configFile, updated);
            console.log(`Configured custom domain: ${customDomain}`);
          '

      - name: Deploy ${{ matrix.worker_name }}
        if: steps.should_deploy.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./
          command: deploy --minify src/index.ts --config ${{ matrix.config }} --name ${{ matrix.worker_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
